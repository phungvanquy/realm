name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p out/${{ matrix.target }}
      - name: build cross
        uses: ./.github/actions/build/cross
        with:
          mode: cross
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      - name: gzip binaries
        run: |
          tar -C out/${{ matrix.target }} -zcf out/${{ matrix.target }}/realm-${{ matrix.target }}.tar.gz realm
          tar -C out/${{ matrix.target }} -zcf out/${{ matrix.target }}/realm-slim-${{ matrix.target }}.tar.gz realm-slim
      - name: release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: out/${{ matrix.target }}/*.tar.gz
