name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - name: test installer
        run: |
          bash -n install.sh
          python3 -B -m unittest discover -s tests -p 'test_install.py'
      - run: mkdir -p out/${{ matrix.target }}
      - name: build cross
        uses: ./.github/actions/build/cross
        with:
          mode: cross
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      - name: package binaries and checksums
        working-directory: out/${{ matrix.target }}
        run: |
          tar -zcf realm-${{ matrix.target }}.tar.gz realm
          tar -zcf realm-slim-${{ matrix.target }}.tar.gz realm-slim
          sha256sum realm-${{ matrix.target }}.tar.gz > realm-${{ matrix.target }}.tar.gz.sha256
          sha256sum realm-slim-${{ matrix.target }}.tar.gz > realm-slim-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            out/${{ matrix.target }}/*.tar.gz
            out/${{ matrix.target }}/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: verify release checksums
        working-directory: out
        run: sha256sum --check -- *.sha256
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/*.sha256
          body: |
            Prebuilt Linux binaries for Ubuntu AMD64 and ARM64, with full and slim builds and SHA-256 checksums.

            Install this version without a GitHub account or token:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/phungvanquy/realm/${{ github.ref_name }}/install.sh | bash -s -- --version ${{ github.ref_name }}
            ```

            Add `--slim` for the smaller TCP/UDP build, or `--install-dir "$HOME/.local/bin"` to install without sudo.

            See the [installation and systemd guide](https://github.com/phungvanquy/realm/blob/${{ github.ref_name }}/readme.md#install-on-ubuntu) for configuration and service setup.
