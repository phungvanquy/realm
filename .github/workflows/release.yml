name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: test shell utilities
        run: |
          bash -n install.sh
          bash -n realmctl
          python3 -B -m unittest discover -s tests -p 'test_*.py'
      - run: mkdir -p out/${{ matrix.target }}
      - name: build Ubuntu binaries
        uses: ./.github/actions/build/cross
        with:
          mode: native
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      - name: test binaries on Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD/out/${{ matrix.target }}:/realm:ro" ubuntu:22.04 \
            sh -ec '/realm/realm --version; /realm/realm-slim --version'
      - name: test realmctl with full and slim relays
        run: |
          REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm" python3 -B -m unittest discover -s tests -p 'test_realm_check.py'
          REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm-slim" python3 -B -m unittest discover -s tests -p 'test_realm_check.py'
          REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm" python3 -B -m unittest discover -s tests -p 'test_realmctl_relay.py'
          REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm-slim" python3 -B -m unittest discover -s tests -p 'test_realmctl_relay.py'
      - name: test realmctl service management with systemd
        run: |
          sudo env REALM_TEST_SYSTEMD=1 REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm" python3 -B -m unittest discover -s tests -p 'test_realmctl_systemd.py'
          sudo env REALM_TEST_SYSTEMD=1 REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm-slim" python3 -B -m unittest discover -s tests -p 'test_realmctl_systemd.py'
      - name: package binaries and checksums
        working-directory: out/${{ matrix.target }}
        run: |
          install -m 0755 "$GITHUB_WORKSPACE/realmctl" realmctl
          tar -zcf realm-${{ matrix.target }}.tar.gz realm realmctl
          tar -zcf realm-slim-${{ matrix.target }}.tar.gz realm-slim realmctl
          sha256sum realm-${{ matrix.target }}.tar.gz > realm-${{ matrix.target }}.tar.gz.sha256
          sha256sum realm-slim-${{ matrix.target }}.tar.gz > realm-slim-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            out/${{ matrix.target }}/*.tar.gz
            out/${{ matrix.target }}/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: verify release checksums
        working-directory: out
        run: sha256sum --check -- *.sha256
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/*.sha256
          body: |
            Prebuilt Linux binaries for Ubuntu 22.04 and newer on AMD64 and ARM64, with full and slim builds, the Bash realmctl service and rule manager, and SHA-256 checksums. Both builds are tested in Ubuntu 22.04 before publication.

            Install this version without a GitHub account or token:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/phungvanquy/realm/${{ github.ref_name }}/install.sh | bash -s -- --version ${{ github.ref_name }}
            ```

            Add `--slim` for the smaller TCP/UDP build, or `--install-dir "$HOME/.local/bin"` to install without sudo.

            See the [installation and systemd guide](https://github.com/phungvanquy/realm/blob/${{ github.ref_name }}/readme.md#install-on-ubuntu) for configuration and service setup.

            Use [realmctl](https://github.com/phungvanquy/realm/blob/${{ github.ref_name }}/readme.realmctl.md) to set up the service, manage named rules, edit shared settings, and control forwarding.
