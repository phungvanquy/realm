name: ci
on:
  push:
    paths-ignore: ["**.md"]
    branches: [master]
  pull_request:
    paths-ignore: ["**.md"]
    branches: [master]
jobs:
  clippy:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: test installer
        run: |
          bash -n install.sh
          python3 -B -m unittest discover -s tests -p 'test_install.py'
      - name: install toolchain
        uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          components: clippy
          write-build-cache: false

      - name: clippy
        run: cargo clippy --target ${{ matrix.target }}
      - name: test core
        run: cargo test -p realm_core --no-fail-fast --features proxy --target ${{ matrix.target }}
      - name: test binary
        run: cargo test --no-fail-fast --target ${{ matrix.target }}
