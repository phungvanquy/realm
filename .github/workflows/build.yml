name: build
on:
  workflow_dispatch:
  push:
    paths-ignore: ["**.md"]
    branches: [main, build-test]
  pull_request:
    paths-ignore: ["**.md"]
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p out/${{ matrix.target }}
      - name: build Ubuntu binaries
        uses: ./.github/actions/build/cross
        with:
          mode: native
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      - name: test binaries on Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD/out/${{ matrix.target }}:/realm:ro" ubuntu:22.04 \
            sh -ec '/realm/realm --version; /realm/realm-slim --version'
      - name: test realmctl with full and slim relays
        run: |
          REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm" python3 -B -m unittest discover -s tests -p 'test_realmctl_relay.py'
          REALM_TEST_BINARY="$PWD/out/${{ matrix.target }}/realm-slim" python3 -B -m unittest discover -s tests -p 'test_realmctl_relay.py'
      - name: upload binary
        uses: actions/upload-artifact@v6
        with:
          name: realm-${{ matrix.target }}
          path: out/${{ matrix.target }}/realm
      - name: upload binary (slim)
        uses: actions/upload-artifact@v6
        with:
          name: realm-slim-${{ matrix.target }}
          path: out/${{ matrix.target }}/realm-slim
