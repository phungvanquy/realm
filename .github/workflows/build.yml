name: build
on:
  workflow_dispatch:
  push:
    paths-ignore: ["**.md"]
    branches: [master, build-test]
  pull_request:
    paths-ignore: ["**.md"]
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p out/${{ matrix.target }}
      - name: build cross
        uses: ./.github/actions/build/cross
        with:
          mode: cross
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      - name: upload binary
        uses: actions/upload-artifact@v6
        with:
          name: realm-${{ matrix.target }}
          path: out/${{ matrix.target }}/realm
      - name: upload binary (slim)
        uses: actions/upload-artifact@v6
        with:
          name: realm-slim-${{ matrix.target }}
          path: out/${{ matrix.target }}/realm-slim
